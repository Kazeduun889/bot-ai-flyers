<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Mini App</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="container">
    <h1>AI Mini App</h1>
    <div class="mode">
      <label>Режим</label>
      <select id="mode">
        <option value="creative">Creative</option>
        <option value="strict">Strict</option>
      </select>
    </div>
    <div class="block">
      <label>Сообщение</label>
      <textarea id="text" placeholder="Напишите запрос"></textarea>
      <button id="sendChat">Отправить в чат</button>
    </div>
    <div class="block">
      <label>Описание изображения</label>
      <input id="prompt" placeholder="Напишите описание">
      <button id="sendImage">Сгенерировать изображение</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
